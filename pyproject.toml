[project]
name = "modbus-sim"
version = "0.1.0"
description = "Modbus TCP/RTU slave simulator with PySide6 UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymodbus>=3.6",
    "PySide6>=6.6",
    "pyserial>=3.5",
]

[project.scripts]
modbus-sim = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
