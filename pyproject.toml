[project]
name = "modbus-sim"
version = "0.1.0"
description = "Modbus TCP/RTU slave simulator with PySide6 UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymodbus>=3.6",
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
test = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
modbus-sim = "modbus_sim.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
