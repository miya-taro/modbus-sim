name: build-desktop

# Windows デスクトップアプリ（Tauri インストーラ）をビルドする。
# ローカル環境で Smart App Control が有効だと cargo のビルドスクリプトが
# ブロックされて `tauri build` が通らないため、CI で生成する。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": "[^"]*"', "`"version`": `"$v`"" | Set-Content src-tauri/tauri.conf.json
          Write-Host "version -> $v"

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build backend sidecar (PyInstaller)
        run: python scripts/build-backend.py

      - name: Install Tauri CLI deps
        run: npm ci

      - name: Tauri build
        run: npx tauri build

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: modbus-sim-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
          body: |
            Windows インストーラ（未署名）。初回起動時に SmartScreen の警告が出たら
            「詳細情報」→「実行」で進めてください。

            Smart App Control が有効で起動できない環境では、ソースから:
            `pip install -r requirements.txt && python main.py --open`
